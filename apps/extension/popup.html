<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AnkiSuperSupporter Sender</title>
    <style>
      body {
        width: 310px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .badge.ok {
        background: #dcfce7;
        color: #166534;
      }
      .badge.err {
        background: #fee2e2;
        color: #991b1b;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }
      select,
      input[type='text'] {
        width: 100%;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 12px;
        box-sizing: border-box;
      }
      .hint {
        font-size: 11px;
        color: #64748b;
        margin-top: 4px;
        line-height: 1.4;
      }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        background: #4f46e5;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        box-sizing: border-box;
      }
      .btn:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">AnkiSuperSupporter</div>
      <span id="status" class="badge err">Đang kiểm tra...</span>
    </div>

    <div class="card">
      <div class="row">
        <label for="floatingBar">Hiện nút nổi khi bôi đen</label>
        <input id="floatingBar" type="checkbox" />
      </div>

      <div class="row">
        <label for="cleanWrapper">Tự bỏ dấu ngoặc kép / bullet đầu dòng</label>
        <input id="cleanWrapper" type="checkbox" />
      </div>

      <div class="row">
        <label for="autoSyncCambridge">Tự động đồng bộ Cambridge &amp; Oxford nền</label>
        <input id="autoSyncCambridge" type="checkbox" />
      </div>
      <div class="hint" style="margin-top: -4px; margin-bottom: 8px">
        Khi tra từ ở Studio bị chặn (403), tự mở tab nền lấy nghĩa Cambridge rồi mở nền Oxford lấy IPA, đồng bộ xong tự đóng.
      </div>

      <div style="margin-top: 8px">
        <label for="insertMode">Chế độ chèn vào trường Example</label>
        <select id="insertMode">
          <option value="replace">Ghi đè (Replace)</option>
          <option value="append">Nối thêm dòng mới (Append)</option>
        </select>
      </div>

      <div style="margin-top: 8px">
        <label for="siteScope">Hiện nút nổi trên</label>
        <select id="siteScope">
          <option value="ai_only">Các trang AI (Grok, Gemini, ChatGPT, Claude)</option>
          <option value="all">Mọi trang web</option>
        </select>
        <div class="hint">
          Menu chuột phải &amp; phím tắt (<code>Alt+1</code> EN, <code>Alt+2</code> VI, <code>Alt+3</code> Word) hoạt động trên mọi trang.
        </div>
      </div>
    </div>

    <div class="card">
      <label for="serverUrl">Địa chỉ Local Server</label>
      <input id="serverUrl" type="text" />
    </div>

    <a id="openStudio" class="btn" href="http://localhost:5173" target="_blank">
      Mở AnkiSuperSupporter Studio
    </a>

    <script src="popup.js"></script>
  </body>
</html>
